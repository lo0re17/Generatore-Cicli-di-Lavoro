{% extends "base.html" %}
{% block titolo %}Accesso — Generatore Cicli{% endblock %}
{% block contenuto %}

<div style="max-width:340px; margin:60px auto">
  <div class="card" style="padding:24px 28px">
    <h2 style="margin:0 0 18px; text-align:center">Accedi</h2>
    <form method="post">
      <label>Utente</label>
      <input name="username" autofocus required>
      <label>Password</label>
      <input name="password" type="password" required>
      <button type="submit" style="width:100%; margin-top:16px">Accedi</button>
    </form>
  </div>
</div>

{% endblock %}
